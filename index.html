    <footer class="footer">

      </div>
      <div class="footer-clock"><p><span id="time"></span></p></div>
    </footer>

  <script>
    // Block right-click on background
    document.querySelector(".background-image").addEventListener("contextmenu", e => e.preventDefault())

    // Current year
    document.getElementById("year").textContent = new Date().getFullYear()

    // Clock
    function updateTime() {
      const now = new Date()
      const hours = String(now.getHours()).padStart(2, "0")
      const minutes = String(now.getMinutes()).padStart(2, "0")
      document.getElementById("time").textContent = `${hours}:${minutes}`
    }
    updateTime()
    setInterval(updateTime, 1000)
  </script>
